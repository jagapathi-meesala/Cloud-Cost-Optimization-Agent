name: recommend-rightsizing
description: Estimate a rightsizing opportunity from utilization, capacity, and supplied monthly cost data.
version: 0.1.0
input_schema:
  type: object
  properties:
    utilization_percent: {type: number, minimum: 0}
    rightsizing_threshold_percent: {type: number, minimum: 0}
    current_capacity: {type: number, minimum: 0}
    target_capacity: {type: number, minimum: 0}
    monthly_cost: {type: number, minimum: 0}
  required: [utilization_percent, rightsizing_threshold_percent, current_capacity, target_capacity, monthly_cost]
output_schema:
  type: object
implementation:
  type: script
  path: ../core/rightsizing.py
  runtime: python3
